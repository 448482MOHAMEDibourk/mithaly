name: Enforce Policies

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [ main ]

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install requirements (if any)
        run: |
          python -m pip install --upgrade pip
      - name: Run preflight checks
        run: |
          python tools/scripts/preflight_check.py
      - name: Snapshot architectural context
        run: |
          python tools/scripts/snapshot_context.py
      - name: Ensure TODO updated when source changes
        run: |
          python tools/scripts/check_todo_updated.py
      - name: (optional) Log preflight outcome
        run: |
          python tools/scripts/log_outcome.py --status success --pattern "preflight_ok"
